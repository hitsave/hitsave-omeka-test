# Throttle concurrent DIP gallery/ARK/preview requests; route to the dip PHP-FPM pool.
location ^~ /omeka-dip/ {
    limit_conn dip_per_ip 12;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_index index.php;
    fastcgi_pass unix:/run/php-fpm-dip.sock;
}

# Site ARK DIP component: /s/{slug}/ark:/{naan}/{item_id}/{media_id}/{file_key}
location ~ "^/s/[^/]+/ark:/[0-9][0-9][0-9][0-9][0-9]/[0-9]+/[0-9]+/" {
    limit_conn dip_per_ip 12;
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_index index.php;
    fastcgi_pass unix:/run/php-fpm-dip.sock;
}
