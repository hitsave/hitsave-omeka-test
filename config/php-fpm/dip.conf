; Dedicated pool for DIP file/ARK streams so admin/API keep the main www pool.
[dip]
user = nobody
group = nobody
listen = /run/php-fpm-dip.sock
listen.owner = nobody
listen.group = nobody
pm = dynamic
pm.max_children = 24
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 6
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
