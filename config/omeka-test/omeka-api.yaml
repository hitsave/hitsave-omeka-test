# Omeka S REST API (ingest worker / uploader containers). Not used by the Omeka container itself.
# Visibility + ARK behavior on prod: docs/omeka-production.md
api:
  # Preservation uploader runs in Docker; host Omeka test stack listens on 8088.
  base_url: http://host.docker.internal:8088/api
  credentials_file: secrets/omeka-api-credentials-local.yaml
  site_slug: hitsave-test
  default_is_public: false
  item_set_title: Press and Marketing Materials
  # Production archive uses o:id 1459; test stack creates/finds set by title.
  production_item_set_id: 1459
  # DIP ingester registered by OmekaDipViewer.
  dip_ingester: omeka_dip_package
