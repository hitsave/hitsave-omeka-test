# Test Omeka S stack — SSOT for this repo (see docs/config-contract.md).
# Copy to settings.yaml (gitignored). Optional overlay: settings.local.yaml (gitignored).
database:
  host: mariadb
  port: 3306
  name: omeka_s
  user: omeka_s
  password: change_me_db_password
  root_password: change_me_root_password

omeka:
  # Use one URL consistently in the browser (CSRF/session). Match how you reach this host (port 8088).
  public_url: http://127.0.0.1:8088
  admin_email: admin@example.com
  admin_name: Admin
  admin_password: change_me_admin_password
  site_title: Hit Save! Archive (test)
  site_slug: hitsave-test
  theme: HitSaveArchive
  item_set_title: Press and Marketing Materials

# REST clients (local Python in this repo). hitsave-archiver omeka-uploader uses
# config/omeka-uploader.yaml — keep site_slug, item_set_title, and base URL in sync.
api:
  base_url: http://host.docker.internal:8088/api
  credentials_file: secrets/omeka-api-credentials-local.yaml
  default_is_public: false
  production_item_set_id: 1459
  dip_ingester: omeka_dip_package

ark:
  naan: "78322"
  name: internal
  qualifier: internal
  qualifier_static: true
  property: dcterms:identifier

site:
  batch_listing:
    page_slug: press-batch
    page_title: Press batch uploads
    nav_label: Press batch
    item_set_title: Representation Copies (T batch test)
    item_title_search: Representation Copies (T batch test)
    min_item_id: 10
    browse_limit: 100

# Omeka DIP Viewer: configure in Omeka admin (Modules → Omeka DIP Viewer), not here.

storage:
  aip:
    backend: s3
    endpoint: https://s3.wasabisys.com
    region: us-east-1
    bucket: your-aip-bucket-name
    prefix: press-material/
